name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=umich_transit --cov-report=term-missing
      - name: Audit dependencies
        run: |
          uv export --all-extras --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
